<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Quiz App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="quiz-container">
    <header class="header">
      <h1>🧠 JavaScript Quiz</h1>
      <p>Test your knowledge and improve your skills!</p>
    </header>

    <section id="start-screen" class="screen">
      <h2>Ready to Play?</h2>
      <p>Answer 10 questions. You have 15 seconds for each question.</p>
      <button id="start-btn" class="primary-btn">Start Quiz</button>
    </section>

    <section id="quiz-screen" class="screen hidden">
      <div class="quiz-info">
        <span id="question-count">Question 1 of 10</span>
        <span id="timer">⏱ 15s</span>
      </div>

      <div class="progress-track">
        <div id="progress-bar"></div>
      </div>

      <h2 id="question">Question appears here</h2>
      <div id="options" class="options"></div>
      <p id="feedback" aria-live="polite"></p>

      <button id="next-btn" class="primary-btn" disabled>
        Next Question
      </button>
    </section>

    <section id="result-screen" class="screen hidden">
      <h2>🎉 Quiz Completed!</h2>
      <p id="result-message"></p>
      <p id="score" class="score">0 / 10</p>
      <p id="percentage"></p>
      <button id="restart-btn" class="primary-btn">Play Again</button>
    </section>
  </main>
</body>
</html>
